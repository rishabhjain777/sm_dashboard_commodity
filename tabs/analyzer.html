<div class="analyzer-hero-card">
  <div style="font-size:18px; font-weight:800; color:#0f172a; margin-bottom:4px;">
    &#128373; 360&#176; Commodity Intelligence Dossier
  </div>
  <div style="font-size:13px; color:#475569; margin-bottom:14px;">
    Search any MCX commodity to view synthesized confluence: Market Signal, Quality/Score breakdown, AI Quant model stance, and Final Actionable Verdict.
  </div>

  <div style="position:relative; max-width:600px;">
    <div style="display:flex; gap:8px;">
      <input
        type="text"
        id="analyzerInput"
        placeholder="Search any commodity symbol (e.g. GOLD, SILVER, CRUDEOIL)..."
        oninput="onAnalyzerSearchInput(this.value)"
        onkeydown="onAnalyzerSearchKeyDown(event)"
        style="flex:1; padding:10px 14px; font-size:14px; border:2px solid #cbd5e1; border-radius:8px; outline:none;"
      >
      <button onclick="triggerAnalyzerSearch()" class="analyzer-search-btn">
        Analyze
      </button>
    </div>
    <div id="analyzerSuggestions" class="analyzer-suggestions" style="display: none;"></div>
  </div>

  <div style="margin-top:12px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
    <span style="font-size:12px; font-weight:700; color:#64748b;">Quick Commodities:</span>
        <button class="analyzer-chip" onclick="selectAnalyzerCommodity('GOLD')">GOLD</button>
    <button class="analyzer-chip" onclick="selectAnalyzerCommodity('SILVER')">SILVER</button>
    <button class="analyzer-chip" onclick="selectAnalyzerCommodity('CRUDEOIL')">CRUDEOIL</button>
    <button class="analyzer-chip" onclick="selectAnalyzerCommodity('NATURALGAS')">NATURALGAS</button>
    <button class="analyzer-chip" onclick="selectAnalyzerCommodity('COPPER')">COPPER</button>
    <button class="analyzer-chip" onclick="selectAnalyzerCommodity('ZINC')">ZINC</button>
    <button class="analyzer-chip" onclick="selectAnalyzerCommodity('ALUMINIUM')">ALUMINIUM</button>
    <button class="analyzer-chip" onclick="selectAnalyzerCommodity('LEAD')">LEAD</button>
  </div>
</div>

<div id="analyzerDossier">
