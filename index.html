<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCX Commodity Market Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem("dashboardTheme");
        if (!savedTheme) {
          savedTheme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? "dark" : "light";
        }
        if (savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>

  <div class="dashboard-header-bar">
    <h2 style="margin:0;">MCX Commodity Market Dashboard</h2>
    <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleDashboardTheme()" title="Toggle Dark/Light Mode">
      <span id="themeToggleIcon">&#9790;</span>
      <span id="themeToggleText">Dark Mode</span>
    </button>
  </div>


  <div class="tab-nav">
    <button class="tab-nav-btn active" id="tabBtn-market" onclick="switchDashboardTab('market')">
      &#128202; MCX Market Signals
    </button>
    <button class="tab-nav-btn" id="tabBtn-analyzer" onclick="switchDashboardTab('analyzer')">
      &#128373; 360&#176; Stock Analyzer
      <span class="tab-badge" style="background:#2563eb; color:white;">Unified</span>
    </button>
    <button class="tab-nav-btn" id="tabBtn-trade-plan" onclick="switchDashboardTab('trade-plan')">
      &#127919; Prediction Result
      <span class="tab-badge" id="pred-badge">0 Active</span>
    </button>
    <button class="tab-nav-btn" id="tabBtn-quality" onclick="switchDashboardTab('quality')">
      &#9733; Quant Commodity Scores
      <span class="tab-badge">16</span>
    </button>
    <button class="tab-nav-btn" id="tabBtn-analytics" onclick="switchDashboardTab('analytics')">
      &#9889; AI Quant Predictions
      <span class="tab-badge">16</span>
    </button>

  </div>

  <div id="tab-container">
    <div id="tabLoading" class="tab-loading-spinner" style="display:none;">
      <div class="tab-spinner"></div>
      <div class="tab-loading-text">Loading dashboard intelligence...</div>
    </div>
  </div>

  <script src="js/tab-templates.js"></script>
  <script src="js/analyzer.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
